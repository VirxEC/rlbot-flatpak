name: Build flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50 # keep in sync with runtime-version
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_GRIP: ${{ secrets.GPG_KEY_GRIP }}
        run: |
          mkdir -p ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          for candidate in gpg-preset-passphrase /usr/libexec/gnupg/gpg-preset-passphrase /usr/lib/gnupg2/gpg-preset-passphrase /usr/lib/gnupg/gpg-preset-passphrase; do
            if command -v "$candidate" >/dev/null 2>&1 || [ -x "$candidate" ]; then
              PRESET="$candidate"
              break
            fi
          done
          if [ -z "$PRESET" ]; then
            echo "::error::gpg-preset-passphrase not found in PATH or known locations"
            exit 1
          fi
          echo "$GPG_PASSPHRASE" | "$PRESET" --preset "$GPG_KEY_GRIP"
          echo "test signing" | gpg --batch --local-user "$GPG_KEY_ID" --detach-sign --output /tmp/gpg-test.sig
          rm -f /tmp/gpg-test.sig

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.rlbot.gui.flatpak
          manifest-path: org.rlbot.gui.yml
          repo-dir: repo
          gpg-sign: ${{ secrets.GPG_KEY_ID }}
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Generate repository metadata
        run: flatpak build-update-repo --gpg-sign=${{ secrets.GPG_KEY_ID }} --generate-static-deltas --prune repo

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v3
        with:
          files: org.rlbot.gui.flatpak

      - name: Publish repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
