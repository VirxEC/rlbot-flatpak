[package]
name = "rlbot-launcher"
version = "0.1.0"
edition = "2024"
description = "RLBot v5 launcher for the org.rlbot.gui flatpak: keeps RLBotServer and rlbotgui in sync from their GitHub releases"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha256 = "1.6.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
strip = true
lto = true
