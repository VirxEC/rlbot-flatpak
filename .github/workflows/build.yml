name: Build flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50 # keep in sync with runtime-version
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_KEY_GRIP: ${{ secrets.GPG_KEY_GRIP }}
        run: |
          umask 077
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # Importing a key does not need the passphrase.
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import

          # A fake pinentry supplies the passphrase, so gpg-agent never
          # opens a dialog. The config and passphrase file stay in
          # ~/.gnupg, so every later step (flatpak-builder,
          # build-update-repo) can sign even when a fresh gpg-agent
          # starts.
          printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/gpg-passphrase
          chmod 600 ~/.gnupg/gpg-passphrase
          cat > ~/.gnupg/fake-pinentry.sh <<'PINENTRY'
          #!/bin/sh
          echo "OK Pleased to meet you"
          while read -r line; do case "$line" in GETPIN) echo "D $(cat "$HOME/.gnupg/gpg-passphrase")"; echo "OK";; BYE) echo "OK"; exit 0;; *) echo "OK";; esac; done
          PINENTRY
          chmod +x ~/.gnupg/fake-pinentry.sh
          {
            echo "allow-preset-passphrase"
            echo "pinentry-program $HOME/.gnupg/fake-pinentry.sh"
          } > ~/.gnupg/gpg-agent.conf

          # Pre-cache the passphrase with gpg-preset-passphrase when
          # available. Its location differs per distro (Fedora:
          # /usr/libexec, Debian: /usr/lib/gnupg2, Arch: /usr/lib/gnupg),
          # so search for it instead of hardcoding paths.
          PRESET="$(command -v gpg-preset-passphrase 2>/dev/null || true)"
          if [ -z "$PRESET" ]; then
            PRESET="$(find /usr /opt /usr/local -name gpg-preset-passphrase -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$PRESET" ]; then
            gpg-connect-agent reloadagent /bye
            echo "$GPG_PASSPHRASE" | "$PRESET" --preset "$GPG_KEY_GRIP"
          else
            gpgconf --kill gpg-agent
          fi

          # Verify the passphrase works before the long flatpak build.
          echo "test signing" | gpg --batch --local-user "$GPG_KEY_ID" --detach-sign --output /tmp/gpg-test.sig
          rm -f /tmp/gpg-test.sig

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.rlbot.gui.flatpak
          manifest-path: org.rlbot.gui.yml
          repo-dir: repo
          gpg-sign: ${{ secrets.GPG_KEY_ID }}
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Generate repository metadata
        run: flatpak build-update-repo --gpg-sign=${{ secrets.GPG_KEY_ID }} --generate-static-deltas --prune repo

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v3
        with:
          files: org.rlbot.gui.flatpak

      - name: Publish repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
